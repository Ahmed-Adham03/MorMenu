<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 100px; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(245, 245, 247, 0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid #d2d2d7;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; margin-right: auto; }

    .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-blue { background: #0071e3; color: #fff; }
    .btn-blue:hover { background: #0077ed; }
    .btn-gray { background: #d2d2d7; color: #1d1d1f; }
    .btn-gray:hover { background: #c7c7cc; }
    .btn-link { background: none; color: #0066cc; padding: 9px 8px; }
    .btn-link:hover { text-decoration: underline; }

    .status {
      font-size: 13px;
      color: #0071e3;
      min-height: 18px;
    }

    .cafe-input {
      width: 100%;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      background: #fff;
      color: #1d1d1f;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e8ed;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .card-title { font-size: 17px; font-weight: 600; }

    .side-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #86868b;
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 15px;
      background: #fff;
      color: #1d1d1f;
    }

    .field input:focus, .cafe-input:focus, .sec-en:focus, .sec-ar:focus {
      outline: 2px solid #0071e3;
      outline-offset: -1px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 1.4fr 1.4fr 0.7fr 0.7fr auto;
      gap: 10px;
      align-items: end;
      padding: 10px 0;
      border-top: 1px solid #f0f0f2;
    }

    .remove-btn, .add-item-btn, .add-sec-btn {
      background: none;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      color: #1d1d1f;
      font-size: 13px;
      padding: 7px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .remove-btn { color: #c0392b; border-color: #e0a09c; }
    .remove-btn:hover { background: #fdecea; }
    .add-item-btn { color: #0071e3; border-color: #a8cdf0; margin-top: 12px; }
    .add-item-btn:hover { background: #eef6ff; }
    .add-sec-btn:hover { background: #eef6ff; }

    @media (max-width: 640px) {
      .item-row { grid-template-columns: 1fr 1fr; }
      .item-row .remove-btn { justify-self: start; }
      .side-inputs { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Menu Editor</h1>
    <div class="topbar-actions">
      <span class="status" id="status"></span>
      <button class="btn btn-gray" id="btnReset">Reset</button>
      <button class="btn btn-blue" id="btnSave">Generate index.html</button>
    </div>
  </div>

  <div class="wrap">
    <input class="cafe-input" id="cafeEn" placeholder="Menu subtitle (e.g. Our Menu)">

    <div id="sections"></div>
    <button class="add-sec-btn" id="btnAddSection">+ Add section</button>
  </div>

  <script>
    var INDEX_TEMPLATE = `<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    .item {

    .item-name {
      font-size: 16px;
      font-weight: 500;
      color: #424245;
    }

    .item-ar {
      display: block;
      font-size: 16px;
      font-weight: 600;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #1d1d1f;
      direction: rtl;

    }

    .item-right { text-align: right; flex-shrink: 0; margin-left: 16px; }

      font-size: 17px;
      font-weight: 700;
      color: #1d1d1f;
    }

    .size { font-size: 12px; color: #86868b; }

    @media (max-width: 760px) {
      .columns { grid-template-columns: 1fr; gap: 0; }

    }
  </style>
</head>
<body>
  <div class="menu">
    <div class="menu-header">
      <img class="logo" src="Logo.png" alt="Mor">
      <p class="menu-subtitle" id="subtitle"></p>
    </div>
    <div class="columns" id="columns"></div>
  </div>

  <script id="menu-data" type="application/json">
__INDEX_JSON__
  <\/script>
  <script>
    var data = JSON.parse(document.getElementById("menu-data").textContent);
    document.getElementById("subtitle").textContent = data.cafe.en;

    var columns = document.getElementById("columns");
    var left = document.createElement("div");
    var right = document.createElement("div");
    var mid = Math.ceil(data.sections.length / 2);

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    data.sections.forEach(function (section, i) {
      var sec = document.createElement("section");

      var head = document.createElement("div");
      head.className = "section-header";
      var t = document.createElement("h2");
      t.className = "section-title";
      t.textContent = section.en;
      var tAr = document.createElement("span");
      tAr.className = "section-title-ar";
      tAr.textContent = section.ar;
      head.appendChild(t);
      head.appendChild(tAr);
      sec.appendChild(head);

      section.items.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "item";

        var lb = document.createElement("div");
        lb.className = "item-left";
        var ar = document.createElement("span");
        ar.className = "item-ar";
        ar.textContent = item.ar;
        var en = document.createElement("span");
        en.className = "item-name";
        en.textContent = item.en;
        lb.appendChild(ar);
        lb.appendChild(en);

        var rb = document.createElement("div");
        rb.className = "item-right";
        rb.innerHTML =
          '<span class="size">' + esc(item.size) + '</span> &nbsp; ' +
          '<span class="price">' + esc(item.price) + "</span> SR";

        row.appendChild(lb);
        row.appendChild(rb);
        sec.appendChild(row);
      });

      (i < mid ? left : right).appendChild(sec);
    });

    columns.appendChild(left);
    columns.appendChild(right);
  <\/script>
</body>
</html>
`;

    var DEFAULT_DATA = {
      cafe: { en: "Our Menu" },
      sections: [
        { en: "Hot Drinks", ar: "المشروبات الساخنة", items: [
          { ar: "سبانيش لاتيه صغير", en: "Spanish Latte Hot – Small", size: "9 oz", price: "11" },
          { ar: "سبانيش لاتيه كبير", en: "Spanish Latte Hot – Large", size: "12 oz", price: "13" },
          { ar: "كابتشينو صغير", en: "Cappuccino – Small", size: "9 oz", price: "10" },
          { ar: "كابتشينو كبير", en: "Cappuccino – Large", size: "12 oz", price: "12" },
          { ar: "كورتدو", en: "Cortado", size: "7 oz", price: "9" },

        ] },
        { en: "Coffee", ar: "القهوة", items: [
          { ar: "قهوة اليوم صغير (ساخن)", en: "Today's Coffee Hot – Small", size: "9 oz", price: "4.5" },
          { ar: "قهوة اليوم صغير (بارد)", en: "Today's Coffee Iced – Small", size: "9 oz", price: "4.5" },
          { ar: "قهوة اليوم كبير (ساخن)", en: "Today's Coffee Hot – Large", size: "12 oz", price: "6.9" },
          { ar: "قهوة اليوم كبير (بارد)", en: "Today's Coffee Iced – Large", size: "12 oz", price: "6.9" },
          { ar: "V60 صغير (ساخن)", en: "V60 Hot – Small", size: "11 oz", price: "10" },
          { ar: "V60 كبير (ساخن)", en: "V60 Hot – Large", size: "12 oz", price: "12" },
          { ar: "V60 صغير (بارد)", en: "V60 Iced – Small", size: "11 oz", price: "10" },

          { ar: "أمريكانو", en: "Americano", size: "9 oz", price: "9" },

        ] },

          { ar: "شاي كرك", en: "Karak Tea", size: "9 oz", price: "5" },
          { ar: "شاي إنجليزي", en: "English Tea", size: "9 oz", price: "5" },
          { ar: "شاي عادي", en: "Regular Tea", size: "9 oz", price: "3" },
          { ar: "شاي بالحليب", en: "Milk Tea", size: "9 oz", price: "4" }
        ] },
        { en: "Cold Drinks", ar: "المشروبات الباردة", items: [
          { ar: "كركدية صغير", en: "Hibiscus – Small", size: "11 oz", price: "8" },
          { ar: "كركدية كبير", en: "Hibiscus – Large", size: "16 oz", price: "9" },

          { ar: "تي ايس كبير", en: "Iced Tea – Large", size: "16 oz", price: "15" },
          { ar: "أمريكانو ايس", en: "Iced Americano", size: "12 oz", price: "10" },
          { ar: "لاتيه ايس", en: "Iced Latte", size: "12 oz", price: "12" },
          { ar: "ماكياتو كراميل ايس", en: "Iced Caramel Macchiato", size: "13 oz", price: "13" },
          { ar: "لاتيه بيستاشيو ايس", en: "Iced Pistachio Latte", size: "12 oz", price: "14" },
          { ar: "موكا وايت ايس", en: "Iced White Mocha", size: "12 oz", price: "13" },
          { ar: "موكا ايس صغير", en: "Mocha Iced – Small", size: "12 oz", price: "12" },
          { ar: "موكا ايس كبير", en: "Mocha Iced – Large", size: "16 oz", price: "15" },
          { ar: "موهيتو ايس", en: "Mojito Iced", size: "12 oz", price: "10" }
        ] }
      ]
    };

    var sectionsEl = document.getElementById("sections");
    var statusEl = document.getElementById("status");
    var currentData = JSON.parse(JSON.stringify(DEFAULT_DATA));

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function field(labelText, value) {
      var f = document.createElement("div");
      f.className = "field";
      var l = document.createElement("label");
      l.textContent = labelText;
      var i = document.createElement("input");
      i.type = "text";
      i.value = value == null ? "" : value;
      f.appendChild(l);
      f.appendChild(i);
      return f;
    }

    function renderSection(section, si) {
      var card = document.createElement("div");
      card.className = "card";

      var head = document.createElement("div");
      head.className = "card-head";
      var title = document.createElement("div");
      title.className = "card-title";
      title.textContent = "Section " + (si + 1);

      var side = document.createElement("div");
      side.className = "side-inputs";
      var enF = field("Section name (English)", section.en);
      var arF = field("اسم القسم (عربي)", section.ar);
      side.appendChild(enF);
      side.appendChild(arF);

      var delSec = document.createElement("button");
      delSec.className = "remove-btn";
      delSec.textContent = "Remove section";
      delSec.addEventListener("click", function () {
        card.remove();
      });

      head.appendChild(title);
      head.appendChild(delSec);
      card.appendChild(head);
      card.appendChild(side);

      var itemsBox = document.createElement("div");
      itemsBox.className = "items-box";

      function addItem(myItem) {
        var row = document.createElement("div");
        row.className = "item-row";

        var it = myItem || { ar: "", en: "", size: "", price: "" };
        var fAr = field("العربية", it.ar);
        var fEn = field("English", it.en);
        var fSize = field("Size", it.size);
        var fPrice = field("Price (SR)", it.price);
        var rm = document.createElement("button");
        rm.className = "remove-btn";
        rm.textContent = "x";
        rm.addEventListener("click", function () {
          row.remove();
        });

        row.appendChild(fEn);
        row.appendChild(fAr);
        row.appendChild(fSize);
        row.appendChild(fPrice);
        row.appendChild(rm);
        itemsBox.appendChild(row);
      }

      section.items.forEach(addItem);

      var addBtn = document.createElement("button");
      addBtn.className = "add-item-btn";
      addBtn.textContent = "+ Add item";
      addBtn.addEventListener("click", function () {
        addItem(null);
      });

      card.appendChild(itemsBox);
      card.appendChild(addBtn);
      return card;
    }

    function buildEditor(data) {
      sectionsEl.textContent = "";
      document.getElementById("cafeEn").value = data.cafe.en;
      data.sections.forEach(function (s, i) {
        sectionsEl.appendChild(renderSection(s, i));
      });
    }

    function collect() {
      var res = { cafe: { en: document.getElementById("cafeEn").value.trim() }, sections: [] };
      Array.prototype.forEach.call(sectionsEl.children, function (card) {
        var sec = {};
        var inputs = card.querySelectorAll(".side-inputs input");
        sec.en = inputs[0].value.trim();
        sec.ar = inputs[1].value.trim();
        sec.items = [];
        Array.prototype.forEach.call(card.querySelectorAll(".item-row"), function (row) {
          var ins = row.querySelectorAll("input");
          sec.items.push({
            en: ins[0].value.trim(),
            ar: ins[1].value.trim(),
            size: ins[2].value.trim(),
            price: ins[3].value.trim()
          });
        });
        res.sections.push(sec);
      });
      if (!res.cafe.en) res.cafe.en = "Our Menu";
      return res;
    }

    function generateIndexHtml(data) {
      var pretty = JSON.stringify(data, null, 2);
      return INDEX_TEMPLATE.replace("__INDEX_JSON__", pretty);
    }

    function download(text, filename) {
      var blob = new Blob([text], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 100);
    }

    document.getElementById("btnSave").addEventListener("click", async function () {
      var data = collect();
      var html = generateIndexHtml(data);
      setStatus("Generating…");

      try {
        if (window.showSaveFilePicker) {
          var handle = await window.showSaveFilePicker({
            suggestedName: "index.html",
            types: [{ description: "HTML", accept: { "text/html": [".html"] } }]
          });
          var writable = await handle.createWritable();
          await writable.write(html);
          await writable.close();
          setStatus("index.html updated on disk. Push to GitHub to publish.");
          return;
        }
      } catch (e) {
        if (e.name === "AbortError") {
          setStatus("");
          return;
        }
      }

      download(html, "index.html");
      setStatus("index.html downloaded — replace the file in your folder, then push.");
    });

    document.getElementById("btnReset").addEventListener("click", function () {
      if (!confirm("Reset all fields back to the original menu?")) return;
      buildEditor(JSON.parse(JSON.stringify(DEFAULT_DATA)));
      setStatus("Reset to original.");
    });

    document.getElementById("btnAddSection").addEventListener("click", function () {
      var n = currentData.sections.length + 1;
      currentData.sections.push({ en: "New Section", ar: "قسم جديد", items: [] });
      sectionsEl.appendChild(renderSection(currentData.sections[currentData.sections.length - 1], n));
    });

    function tryLoadFromIndex() {
      fetch("index.html")
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var m = html.match(/<script id="menu-data" type="application\/json">([\s\S]*?)<\/script>/);
          if (m) {
            var d = JSON.parse(m[1]);
            if (d && d.cafe && d.sections) {
              currentData = d;
              buildEditor(d);
              setStatus("Loaded current menu from index.html.");
            }
          }
        })
        .catch(function () {
          /* file:// access often blocked — using built-in data */
        });
    }

    buildEditor(currentData);
    tryLoadFromIndex();
  </script>
</body>
</html>
