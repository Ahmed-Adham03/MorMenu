<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    img { display: block; width: 100%; height: auto; -webkit-user-select: none; }
    .qr { text-align: center; padding: 24px 16px 40px; }
    .qr img { width: 180px; height: 180px; margin: 0 auto; }
    .qr p { margin-top: 12px; font-size: 16px; letter-spacing: -0.2px; }
  </style>
</head>
<body>
  <img src="menu-1.png" alt="">
  <div class="qr">
    <img src="qr-menu.png" alt="QR code">
    <p>Scan here for menu</p>
  </div>
</body>
</html>
