<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mor Cafe Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 48px 24px 32px;
    }

    header h1 {
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 600;
      letter-spacing: -0.28px;
      line-height: 1.07;
    }

    header p {
      margin-top: 12px;
      font-size: 17px;
      color: rgba(255,255,255,0.6);
      letter-spacing: -0.374px;
      line-height: 1.47;
    }

    .pdf-container {
      flex: 1;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    .pdf-container iframe,
    .pdf-container object {
      width: 100%;
      height: calc(100dvh - 200px);
      border: none;
      border-radius: 12px;
      background: #1d1d1f;
    }

    .fallback {
      text-align: center;
      padding: 48px 24px;
    }

    .fallback a {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 15px;
      background: #0071e3;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
      letter-spacing: -0.374px;
    }

    .fallback a:hover { background: #0077ed; }

    @media (max-width: 640px) {
      header { padding: 32px 20px 24px; }
      .pdf-container { padding: 0 8px 32px; }
      .pdf-container iframe,
      .pdf-container object {
        height: calc(100dvh - 180px);
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mor</h1>
    <p>Our Menu</p>
  </header>

  <div class="pdf-container">
    <object data="Menu.pdf" type="application/pdf">
      <div class="fallback">
        <p>Your browser can't display the PDF.</p>
        <a href="Menu.pdf" download>Download Menu</a>
      </div>
    </object>
  </div>
</body>
</html>
