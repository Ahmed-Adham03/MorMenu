<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mor Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .menu {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .menu-header {
      text-align: center;
      margin-bottom: 44px;
    }

    .logo {
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .menu-subtitle {
      font-size: 22px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.3px;
    }

    .menu-hours {
      margin-top: 8px;
      font-size: 14px;
      color: #6e6e73;
    }

    .menu-hours-ar {
      margin-top: 2px;
      font-size: 14px;
      color: #6e6e73;
      direction: rtl;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }

    section { margin-bottom: 40px; }

    .section-icon {
      text-align: center;
      margin-bottom: 6px;
      color: #1d1d1f;
      line-height: 0;
    }

    .section-icon svg {
      width: 30px;
      height: 30px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid #1d1d1f;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .section-title-ar {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      direction: rtl;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid #d2d2d7;
    }

    .item-name {
      font-size: 16px;
      font-weight: 500;
      color: #424245;
    }

    .item-ar {
      display: block;
      font-size: 16px;
      font-weight: 400;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #1d1d1f;
      direction: rtl;
      text-align: right;
    }

    .item-right { text-align: right; flex-shrink: 0; margin-left: 16px; }

    .price {
      font-size: 17px;
      font-weight: 700;
      color: #1d1d1f;
    }

    .size { font-size: 12px; color: #86868b; }

    .riyal {
      height: 15px;
      width: auto;
      vertical-align: -2px;
    }

    @media (max-width: 760px) {
      .columns { grid-template-columns: 1fr; gap: 0; }
      .menu { padding: 24px 18px 64px; }
    }
  </style>
</head>
<body>
  <div class="menu">
    <div class="menu-header">
      <img class="logo" src="assets/Logo.png" alt="Mor">
      <p class="menu-subtitle" id="subtitle"></p>
      <p class="menu-hours" id="hours"></p>
      <p class="menu-hours-ar" id="hoursAr"></p>
    </div>
    <div class="columns" id="columns"></div>
  </div>

  <script>
    var data = JSON.parse(document.getElementById("menu-data").textContent);
    document.getElementById("subtitle").textContent = data.cafe.en;
    if (data.cafe.hours_en) document.getElementById("hours").textContent = data.cafe.hours_en;
    if (data.cafe.hours_ar) document.getElementById("hoursAr").textContent = data.cafe.hours_ar;

    var columns = document.getElementById("columns");
    var left = document.createElement("div");
    var right = document.createElement("div");
    var mid = Math.ceil(data.sections.length / 2);

    var ICONS = {
      hot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.5h11v5a4.5 4.5 0 0 1-4.5 4.5H9a4.5 4.5 0 0 1-4.5-4.5v-5Z"/><path d="M15.5 11.5H17a1.75 1.75 0 0 1 0 3.5h-1.5"/><path d="M8 4.5c-.7.8-.7 1.9 0 2.7"/><path d="M12 4.5c-.7.8-.7 1.9 0 2.7"/></svg>',
      coffee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C8 4.8 5 8.7 5 11.8 5 16.9 8.2 21 12 21s7-4.1 7-9.2C19 8.7 16 4.8 12 3Z"/><path d="M12 6v12"/><path d="M8.5 11.5c1.2-.9 2.4-1.8 3.5-3"/></svg>',
      tea: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10h11v4a4.5 4.5 0 0 1-4.5 4.5H9A4.5 4.5 0 0 1 4.5 14v-4Z"/><path d="M15.5 11H17a1.75 1.75 0 0 1 0 3.5h-1.5"/><path d="M8.5 5c0 1 .8 1.8 1 2.8"/></svg>',
      cold: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l2.2 5.5A6.2 6.2 0 0 1 12 16a6.2 6.2 0 0 1-7.2-7.5L7 3Z"/><path d="M9.5 4L7 9.5"/><rect x="10" y="9" width="2.2" height="2.2" rx="0.5"/></svg>',
      star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/></svg>',
      leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 8 13 4 20 4c0 7-4 15-15 15Z"/><path d="M5 19c3-3 6-6 9-8"/></svg>',
      heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10Z"/></svg>'
    };

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    data.sections.forEach(function (section, i) {
      var sec = document.createElement("section");

      if (section.icon) {
        var icon = document.createElement("div");
        icon.className = "section-icon";
        if (ICONS[section.icon]) {
          icon.innerHTML = ICONS[section.icon];
        } else {
          icon.textContent = section.icon;
        }
        sec.appendChild(icon);
      }

      var head = document.createElement("div");
      head.className = "section-header";
      var t = document.createElement("h2");
      t.className = "section-title";
      t.textContent = section.en;
      var tAr = document.createElement("span");
      tAr.className = "section-title-ar";
      tAr.textContent = section.ar;
      head.appendChild(t);
      head.appendChild(tAr);
      sec.appendChild(head);

      section.items.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "item";

        var lb = document.createElement("div");
        lb.className = "item-left";
        var en = document.createElement("span");
        en.className = "item-name";
        en.textContent = item.en;
        var ar = document.createElement("span");
        ar.className = "item-ar";
        ar.textContent = item.ar;
        lb.appendChild(en);
        lb.appendChild(ar);

        var rb = document.createElement("div");
        rb.className = "item-right";
        rb.innerHTML =
          '<span class="size">' + esc(item.size) + '</span> &nbsp; ' +
          '<span class="price">' + esc(item.price) + '</span> <img class="riyal" src="assets/Saudi_Riyal_Symbol.svg" alt="">';

        row.appendChild(lb);
        row.appendChild(rb);
        sec.appendChild(row);
      });

      (i < mid ? left : right).appendChild(sec);
    });

    columns.appendChild(left);
    columns.appendChild(right);
  </script>
</body>
</html>
