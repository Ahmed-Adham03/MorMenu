<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mor – Menu (Print)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #FAF8F5 0%, #F2EBE1 100%);
      color: #111111;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }
    @page { size: A4; margin: 10mm; }
    .sheet {
      max-width: 210mm;
      margin: 0 auto;
      background: transparent;
      padding: 11mm 10mm 8mm;
      min-height: 297mm;
    }

    .masthead { text-align: center; margin-bottom: 4mm; }
    .masthead .logo { max-width: 104px; height: auto; }

    /* ---- Tight 2-column master grid ---- */
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm 6mm; margin-top: 1mm; }
    .group { break-inside: avoid; page-break-inside: avoid; }

    /* ---- Slim gold category banner ---- */
    .group-head {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(90deg, #E4B96B 0%, #D4A359 100%);
      border-radius: 3px;
      padding: 3px 8px;
      margin-bottom: 1mm;
    }
    .group-head .en {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 800; font-size: 15px;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #201507;
      line-height: 1.1;
    }
    .group-head .ar {
      direction: rtl; text-align: right;
      font-family: "Cairo", sans-serif;
      font-weight: 800; font-size: 12px;
      color: #33210C;
      margin-left: auto;
      line-height: 1.1;
    }
    .group-head img.ic {
      width: 20px; height: 20px; flex: none;
      object-fit: contain;
      border: 1px solid #B98A2F;
      border-radius: 4px;
      background: #FAF8F5;
    }

    /* ---- Column labels فوق المقاس والسعر ---- */
    .cols-head {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 1px 0 2px;
    }
    .cols-head span {
      font-family: "Cairo", sans-serif;
      font-weight: 800; font-size: 9px;
      letter-spacing: 1px; direction: rtl;
      color: #8A6A15;
      text-align: right;
      white-space: nowrap;
    }
    .cols-head .l-size { width: 24mm; }
    .cols-head .l-price { width: 16mm; }

    /* ---- Compact single-line item rows ---- */
    .items { padding: 0; }
    .item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 2.5px 0;
      border-bottom: 1px solid rgba(197, 155, 39, 0.3);
    }
    .item:last-child { border-bottom: none; }
    .item .name {
      flex: 1.15 1 auto; min-width: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700; font-size: 12.5px;
      color: #111111;
      text-align: left;
      line-height: 1.15;
    }
    .item .ar {
      flex: 1 1 30%; min-width: 0;
      direction: rtl; text-align: right;
      font-family: "Cairo", sans-serif;
      font-weight: 700; font-size: 11px;
      color: #1B1A17;
      line-height: 1.15;
    }
    .item .size {
      flex: 0 0 24mm;
      text-align: right;
      font-size: 10.5px; font-weight: 700;
      color: #4A4238;
    }
    .item .price {
      flex: 0 0 16mm;
      display: flex; align-items: baseline; justify-content: flex-end; gap: 2px;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700; font-size: 13px;
      color: #111111;
      text-align: right;
    }
    .riyal { height: 11px; width: auto; vertical-align: -1px; filter: brightness(0) saturate(100%) invert(58%) sepia(42%) saturate(740%) hue-rotate(6deg) brightness(0.93); }

    .colophon {
      margin-top: 6mm; padding-top: 3mm;
      border-top: 2px solid #D4A359;
      display: flex; align-items: center; justify-content: space-between; gap: 6mm;
      break-inside: avoid; page-break-inside: avoid;
    }
    .colophon .note { font-size: 10px; color: #1B1A17; line-height: 1.6; font-weight: 700; }
    .colophon .note .ar { direction: rtl; text-align: right; }
    .colophon img.qr { width: 52px; height: 52px; background: #FFFFFF; padding: 2px; border: 1px solid #D4A359; }

    .print-btn {
      position: fixed; right: 22px; bottom: 22px;
      background: linear-gradient(135deg, #E4B96B, #D4A359);
      color: #FFFFFF; border: none; padding: 11px 16px;
      font-family: "Cairo", sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer;
    }
    .print-btn:hover { filter: brightness(1.06); }

    @media (max-width: 640px) { .columns { grid-template-columns: 1fr; } }
    @media print {
      body { background: #FAF8F5 !important; }
      .print-btn { display: none; }
      .sheet { padding: 0; min-height: 0; }
    }
  </style>
</head>

      <img class="qr" src="assets/qr-menu.png" alt="Scan for live menu">
    </div>
  </div>

    var ICON_IMAGES = {
      hot: { src: "assets/HotDrinks.png", alt: "Hot drinks" },
      coffee: { src: "assets/coffee.png", alt: "Coffee" },
      tea: { src: "assets/Tea.png", alt: "Tea" },
      cold: { src: "assets/coldDrinks.png", alt: "Cold drinks" }
    };

    function render(data) {
      var cols = document.getElementById("columns");
      cols.textContent = "";
      var left = document.createElement("div");
      var right = document.createElement("div");
      var mid = Math.ceil(data.sections.length / 2);

      data.sections.forEach(function (s, i) {
        var g = document.createElement("div");
        g.className = "group";

        var head = document.createElement("div");
        head.className = "group-head";

        if (s.icon && ICON_IMAGES[s.icon]) {
          var ic = document.createElement("img");
          ic.className = "ic";
          ic.src = ICON_IMAGES[s.icon].src;
          ic.alt = ICON_IMAGES[s.icon].alt;
          head.appendChild(ic);
        }

        var en = document.createElement("span");
        en.className = "en";
        en.textContent = s.en;
        head.appendChild(en);

        var ar = document.createElement("span");
        ar.className = "ar";
        ar.textContent = s.ar;
        head.appendChild(ar);
        g.appendChild(head);

        var itemsBox = document.createElement("div");
        itemsBox.className = "items";

        var colsHead = document.createElement("div");
        colsHead.className = "cols-head";
        var lSize = document.createElement("span");
        lSize.className = "l-size";
        lSize.textContent = "المقاس(اونص)";
        var lPrice = document.createElement("span");
        lPrice.className = "l-price";
        lPrice.textContent = "السعر";
        colsHead.appendChild(lSize);
        colsHead.appendChild(lPrice);
        itemsBox.appendChild(colsHead);

        s.items.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "item";

          var name = document.createElement("span");
          name.className = "name";
          name.textContent = it.en;
          row.appendChild(name);

          var a = document.createElement("span");
          a.className = "ar";
          a.textContent = it.ar;
          row.appendChild(a);

          var size = document.createElement("span");
          size.className = "size";
          size.textContent = it.size;
          row.appendChild(size);

          var price = document.createElement("span");
          price.className = "price";
          price.textContent = it.price;
          row.appendChild(price);

          var ry = document.createElement("img");
          ry.className = "riyal";
          ry.src = "assets/Saudi_Riyal_Symbol.svg";
          ry.alt = "";
          price.appendChild(ry);

          itemsBox.appendChild(row);
        });
        g.appendChild(itemsBox);

        (i < mid ? left : right).appendChild(g);
      });

      cols.appendChild(left);
      cols.appendChild(right);
    }

        })
        .catch(function () {});
