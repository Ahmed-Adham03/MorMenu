<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mor – Menu (Print)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #FAF8F5 0%, #F2EBE1 100%);
      color: #111111;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    @page { size: A4; margin: 12mm; }
    .sheet {
      max-width: 210mm;
      margin: 0 auto;
      background: transparent;
      padding: 14mm 13mm 10mm;
      min-height: 297mm;
    }

    .masthead { text-align: center; }
    .masthead .logo { max-width: 150px; height: auto; }

    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14mm 12mm; margin-top: 10mm; }
    .group { break-inside: avoid; page-break-inside: avoid; }

    /* ---- Typographic category header, no fill ---- */
    .group-head {
      position: relative;
      display: flex; flex-direction: column;
      padding: 0 0 12px;
      margin-bottom: 2mm;
      border-top: 3px solid #C59B27;
    }
    .group-head .lang { display: flex; flex-direction: column; line-height: 1.12; flex: 1; min-width: 0; }
    .group-head .en {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 800; font-size: 30px;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: #111111;
      line-height: 1.1;
    }
    .group-head .en::after {
      content: "";
      display: block;
      width: 70px; height: 5px;
      background: #C59B27;
      margin-top: 8px;
    }
    .group-head .ar {
      direction: rtl; text-align: right;
      font-family: "Cairo", sans-serif;
      font-weight: 800; font-size: 20px;
      color: #1B1A17;
      margin-top: 6px;
    }
    .group-head img.ic {
      position: absolute;
      top: -14px;
      right: 0;
      width: 38px; height: 38px;
      object-fit: contain;
      border: 2px solid #C59B27;
      border-radius: 8px;
      background: #FAF8F5;
    }
    .items { padding: 3mm 1mm 2mm; }

    /* ---- One row per size entry, generous print spacing ---- */
    .item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(197, 155, 39, 0.35);
    }
    .item:last-child { border-bottom: none; }

    .item .names { min-width: 0; }
    .item .name {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700; font-size: 20px; color: #111111;
      letter-spacing: 0.2px;
    }
    .item .ar {
      direction: rtl; text-align: right;
      font-family: "Cairo", sans-serif;
      font-weight: 700; font-size: 17px;
      color: #1B1A17;
    }

    .item .meta { margin-left: auto; text-align: right; flex: none; display: flex; align-items: baseline; gap: 10px; padding-top: 1px; }
    .item .meta .oz { font-size: 15px; font-weight: 700; color: #4A4238; }
    .item .meta .divider { width: 2px; height: 14px; background: rgba(197, 155, 39, 0.5); }
    .item .meta .price {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700; font-size: 22px; color: #111111;
      min-width: 7mm; text-align: right;
    }
    .riyal { height: 16px; width: auto; vertical-align: -2px; margin-left: 1px; filter: brightness(0) saturate(100%) invert(58%) sepia(42%) saturate(740%) hue-rotate(6deg) brightness(0.93); }

    .colophon {
      margin-top: 12mm; padding-top: 6mm;
      border-top: 2px solid #C59B27;
      display: flex; align-items: center; justify-content: space-between; gap: 8mm;
      break-inside: avoid; page-break-inside: avoid;
    }
    .colophon .note { font-size: 13.5px; color: #1B1A17; line-height: 1.7; font-weight: 700; }
    .colophon img.qr { width: 88px; height: 88px; background: #FFFFFF; padding: 3px; border: 2px solid #C59B27; }

    .print-btn {
      position: fixed; right: 22px; bottom: 22px;
      background: linear-gradient(135deg, #D4A359, #C59B27);
      color: #FFFFFF; border: none; padding: 11px 16px;
      font-family: "Cairo", sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer;
    }
    .print-btn:hover { filter: brightness(1.06); }

    @media (max-width: 640px) { .columns { grid-template-columns: 1fr; } }
    @media print {
      body { background: #FAF8F5 !important; }
      .print-btn { display: none; }
      .sheet { padding: 0; min-height: 0; }
    }
  </style>
</head>

    /* Category images from assets/ (same set as the live menu) */
    var ICON_IMAGES = {
      hot: { src: "assets/HotDrinks.png", alt: "Hot drinks" },
      coffee: { src: "assets/coffee.png", alt: "Coffee" },
      tea: { src: "assets/Tea.png", alt: "Tea" },
      cold: { src: "assets/coldDrinks.png", alt: "Cold drinks" }
    };

    function render(data) {
      var cols = document.getElementById("columns");
      cols.textContent = "";
      var left = document.createElement("div");
      var right = document.createElement("div");
      var mid = Math.ceil(data.sections.length / 2);

      data.sections.forEach(function (s, i) {
        var g = document.createElement("div");
        g.className = "group";

        var head = document.createElement("div");
        head.className = "group-head";

        var langs = document.createElement("div");
        langs.className = "lang";
        var en = document.createElement("span");
        en.className = "en";
        en.textContent = s.en;
        var ar = document.createElement("span");
        ar.className = "ar";
        ar.textContent = s.ar;
        langs.appendChild(en);
        langs.appendChild(ar);
        head.appendChild(langs);

        if (s.icon && ICON_IMAGES[s.icon]) {
          var ic = document.createElement("img");
          ic.className = "ic";
          ic.src = ICON_IMAGES[s.icon].src;
          ic.alt = ICON_IMAGES[s.icon].alt;
          head.appendChild(ic);
        }
        g.appendChild(head);

        var itemsBox = document.createElement("div");
        itemsBox.className = "items";
        s.items.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "item";

          var names = document.createElement("div");
          names.className = "names";
          var nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = it.en;
          names.appendChild(nm);
          var na = document.createElement("div");
          na.className = "ar";
          na.textContent = it.ar;
          names.appendChild(na);

          var meta = document.createElement("div");
          meta.className = "meta";
          if (it.size) {
            var oz = document.createElement("span");
            oz.className = "oz";
            oz.textContent = it.size;
            meta.appendChild(oz);
            var dv = document.createElement("span");
            dv.className = "divider";
            meta.appendChild(dv);
          }
          var pr = document.createElement("span");
          pr.className = "price";
          pr.textContent = it.price;
          meta.appendChild(pr);
          var ry = document.createElement("img");
          ry.className = "riyal";
          ry.src = "assets/Saudi_Riyal_Symbol.svg";
          ry.alt = "";
          meta.appendChild(ry);

          row.appendChild(names);
          row.appendChild(meta);
          itemsBox.appendChild(row);
        });
        g.appendChild(itemsBox);

        (i < mid ? left : right).appendChild(g);
      });

      cols.appendChild(left);
      cols.appendChild(right);
    }

    render(EMBEDDED);

    if (window.location.protocol === "http:" || window.location.protocol === "https:") {

        .then(function (r) { return r.text(); })
        .then(function (html) {

          if (m) render(JSON.parse(m[1]));
        })
        .catch(function () {});
