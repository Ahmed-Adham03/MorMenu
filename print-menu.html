<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mor – Menu (Print)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #17130e;
      color: #ede3d2;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    @page { size: A4; margin: 13mm; }
    .sheet {
      max-width: 210mm;
      margin: 0 auto;
      background: #17130e;
      padding: 15mm 13mm 11mm;
      min-height: 297mm;
    }

    .masthead { text-align: center; }
    .masthead .logo { max-width: 130px; height: auto; }
    .masthead .name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      letter-spacing: 0.55em;
      text-indent: 0.55em;
      text-transform: uppercase;
      color: #ede3d2;
      margin-top: 5px;
    }
    .masthead .rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 9px auto 13px;
      max-width: 120px;
    }
    .masthead .rule::before,
    .masthead .rule::after {
      content: "";
      height: 1px;
      width: 34px;
      background: #c08a3e;
    }
    .masthead .rule span {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c08a3e;
    }
    .masthead .hours {
      font-size: 11.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c9bda5;
    }
    .masthead .hours .ar {
      display: block;
      direction: rtl;
      font-size: 11px;
      letter-spacing: 0;
      color: #9c9080;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10mm 10mm;
      margin-top: 9mm;
    }

    .group { break-inside: avoid; page-break-inside: avoid; }

    .group-head {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #c08a3e;
      color: #1c160e;
      padding: 7px 14px;
      margin-bottom: 4mm;
    }
    .group-head .num {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      color: rgba(28, 22, 14, 0.55);
      letter-spacing: 0;
    }
    .group-head .lang { display: flex; flex-direction: column; line-height: 1.15; flex: 1; }
    .group-head .en {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .group-head .ar {
      direction: rtl;
      text-align: right;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }
    .group-head .icon { width: 30px; height: 30px; object-fit: contain; }

    .item {
      display: flex;
      align-items: baseline;
      padding: 0 0 2.6mm;
      margin-bottom: 2.6mm;
      border-bottom: 1px solid rgba(192, 138, 62, 0.35);
    }
    .item:last-child { border-bottom: none; }
    .item .names { flex: 0 1 auto; min-width: 0; }
    .item .name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      color: #ede3d2;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .item .ar {
      direction: rtl;
      text-align: right;
      font-size: 11px;
      color: #a49a88;
    }
    .item .leaders {
      flex: 1;
      border-bottom: 1px dotted rgba(192, 138, 62, 0.65);
      margin: 0 5px 4px;
      min-width: 14px;
    }
    .item .right {
      text-align: right;
      flex: none;
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .item .price {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-style: italic;
      font-weight: 700;
      color: #d8a95a;
    }
    .item .size { font-size: 9.5px; color: #8e8271; }
    .riyal { height: 12px; width: auto; vertical-align: -1px; }

    .colophon {
      margin-top: 10mm;
      padding-top: 4mm;
      border-top: 1px solid rgba(192, 138, 62, 0.55);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .colophon .note { font-size: 10.5px; color: #a49a88; line-height: 1.6; }
    .colophon .note b { color: #d8a95a; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 10px; }
    .colophon .note .ar { direction: rtl; text-align: right; }
    .colophon img.qr { width: 74px; height: 74px; background: #f4efe6; padding: 2px; }

    .print-btn {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: #c08a3e;
      color: #1c160e;
      border: none;
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }
    .print-btn:hover { background: #d8a95a; }

    @media (max-width: 640px) {
      .columns { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #17130e !important; }
      .print-btn { display: none; }
      .sheet { padding: 0; min-height: 0; }
    }
  </style>
</head>
<body>

    <div class="colophon">

      <img class="qr" src="assets/qr-menu.png" alt="Scan for live menu">

  </div>

    var ICONS = {
      hot: "assets/HotDrinks.png",
      coffee: "assets/coffee.png",
      tea: "assets/Tea.png",
      cold: "assets/coldDrinks.png"
    };

    function render(data) {
      var bar = document.getElementById("hours");
      bar.textContent = data.cafe.hours_en;
      var barAr = document.createElement("span");
      barAr.className = "ar";
      barAr.textContent = data.cafe.hours_ar;
      bar.appendChild(barAr);
      document.getElementById("hoursNote").textContent = data.cafe.hours_en;

      var cols = document.getElementById("columns");
      cols.textContent = "";
      var left = document.createElement("div");
      var right = document.createElement("div");
      var mid = Math.ceil(data.sections.length / 2);

      data.sections.forEach(function (s, i) {
        var g = document.createElement("div");
        g.className = "group";

        var head = document.createElement("div");
        head.className = "group-head";
        var num = document.createElement("span");
        num.className = "num";
        num.textContent = "0" + (i + 1);
        head.appendChild(num);

        var langs = document.createElement("div");
        langs.className = "lang";
        var en2 = document.createElement("span");
        en2.className = "en";
        en2.textContent = s.en;
        var ar2 = document.createElement("span");
        ar2.className = "ar";
        ar2.textContent = s.ar;
        langs.appendChild(en2);
        langs.appendChild(ar2);
        head.appendChild(langs);

        if (s.icon && ICONS[s.icon]) {
          var im = document.createElement("img");
          im.className = "icon";
          im.src = ICONS[s.icon];
          im.alt = s.en;
          head.appendChild(im);
        }
        g.appendChild(head);

        s.items.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "item";

          var names = document.createElement("div");
          names.className = "names";
          var nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = it.en;
          var na = document.createElement("div");
          na.className = "ar";
          na.textContent = it.ar;
          names.appendChild(nm);
          names.appendChild(na);

          var lead = document.createElement("div");
          lead.className = "leaders";

          var rightBox = document.createElement("div");
          rightBox.className = "right";
          var pr = document.createElement("span");
          pr.className = "price";
          pr.textContent = it.price;
          var ry = document.createElement("img");
          ry.className = "riyal";
          ry.src = "assets/Saudi_Riyal_Symbol.svg";
          ry.alt = "";
          rightBox.appendChild(pr);
          rightBox.appendChild(ry);
          if (it.size) {
            var sz = document.createElement("span");
            sz.className = "size";
            sz.textContent = it.size;
            rightBox.appendChild(sz);
          }

          row.appendChild(names);
          row.appendChild(lead);
          row.appendChild(rightBox);
          g.appendChild(row);
        });

        (i < mid ? left : right).appendChild(g);
      });

      cols.appendChild(left);
      cols.appendChild(right);
    }

    render(EMBEDDED);

    if (window.location.protocol === "http:" || window.location.protocol === "https:") {

        .then(function (r) { return r.text(); })
        .then(function (html) {
          var m = html.match(/<script id="menu-data" type="application\/json">([\s\S]*?)<\/script>/);
          if (m) {
            render(JSON.parse(m[1]));
          }
        })
        .catch(function () {});
