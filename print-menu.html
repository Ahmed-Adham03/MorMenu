<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Mor – Menu (Print)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #FAF8F5 0%, #F2EBE1 100%);
      color: #111111;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    @page { size: A4; margin: 12mm; }
    .sheet {
      max-width: 210mm;
      margin: 0 auto;
      background: transparent;
      padding: 14mm 13mm 10mm;
      min-height: 297mm;
    }

    .masthead { text-align: center; }
    .masthead .logo { max-width: 150px; height: auto; }
    .masthead .name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      text-transform: uppercase;
      color: #111111;
      margin-top: 6px;
    }
    .masthead .rule {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin: 10px auto 14px; max-width: 170px;
    }
    .masthead .rule::before, .masthead .rule::after {
      content: ""; height: 2px; width: 44px; background: linear-gradient(90deg, transparent, #C59B27);
    }
    .masthead .rule::after { background: linear-gradient(90deg, #C59B27, transparent); }
    .masthead .rule span { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: #C59B27; font-weight: 800; }
    .masthead .hours {
      font-size: 13.5px; letter-spacing: 2px; text-transform: uppercase; color: #33302C; font-weight: 700;
    }
    .masthead .hours .ar { display: block; direction: rtl; font-size: 13px; letter-spacing: 0; color: #4A453C; }

    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14mm 12mm; margin-top: 10mm; }
    .group { break-inside: avoid; page-break-inside: avoid; }

    /* ---- Solid gold banner header, no outline box ---- */
    .group-head {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, #D4A359 0%, #C59B27 100%);
      border-radius: 4px;
      padding: 11px 14px;
    }
    .group-head .num {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 800; font-size: 18px;
      color: #F6D48A;
      background: #1C1A17;
      width: 36px; height: 36px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
    }
    .group-head .lang { display: flex; flex-direction: column; line-height: 1.15; flex: 1; min-width: 0; }
    .group-head .en {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 800; font-size: 21px;
      letter-spacing: 2px; text-transform: uppercase;
      color: #1D1406;
    }
    .group-head .ar {
      direction: rtl; text-align: right;
      font-family: "Cairo", sans-serif;
      font-weight: 800; font-size: 15.5px;
      color: #33210C;
    }
    .group-head .ic { width: 31px; height: 31px; flex: none; }
    .items { padding: 5mm 1mm 2mm; }

    /* ---- One row per size entry, generous print spacing ---- */
    .item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(197, 155, 39, 0.35);
    }
    .item:last-child { border-bottom: none; }

    .item .names { min-width: 0; }
    .item .name {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700; font-size: 18px; color: #111111;
      letter-spacing: 0.2px;
    }
    .item .ar {
      direction: rtl; text-align: right;
      font-family: "Cairo", sans-serif;
      font-weight: 700; font-size: 15px;
      color: #1B1A17;
    }

    .item .meta { margin-left: auto; text-align: right; flex: none; display: flex; align-items: baseline; gap: 9px; padding-top: 1px; }
    .item .meta .oz { font-size: 13.5px; font-weight: 700; color: #5A5142; }
    .item .meta .divider { width: 1px; height: 13px; background: rgba(197, 155, 39, 0.5); }
    .item .meta .price {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700; font-size: 19px; color: #111111;
      min-width: 6.5mm; text-align: right;
    }
    .riyal { height: 14px; width: auto; vertical-align: -2px; margin-left: 1px; filter: brightness(0) saturate(100%) invert(58%) sepia(42%) saturate(740%) hue-rotate(6deg) brightness(0.93); }

    .colophon {
      margin-top: 12mm; padding-top: 6mm;
      border-top: 2px solid #C59B27;
      display: flex; align-items: center; justify-content: space-between; gap: 8mm;
      break-inside: avoid; page-break-inside: avoid;
    }
    .colophon .note { font-size: 12.5px; color: #1B1A17; line-height: 1.7; font-weight: 700; }
    .colophon .note b { color: #8A6A15; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; font-size: 11.5px; }
    .colophon .note .ar { direction: rtl; text-align: right; }
    .colophon img.qr { width: 84px; height: 84px; background: #FFFFFF; padding: 3px; border: 2px solid #C59B27; }

    .print-btn {
      position: fixed; right: 22px; bottom: 22px;
      background: linear-gradient(135deg, #D4A359, #C59B27);
      color: #FFFFFF; border: none; padding: 11px 16px;
      font-family: "Cairo", sans-serif;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer;
    }
    .print-btn:hover { filter: brightness(1.06); }

    @media (max-width: 640px) { .columns { grid-template-columns: 1fr; } }
    @media print {
      body { background: #FAF8F5 !important; }
      .print-btn { display: none; }
      .sheet { padding: 0; min-height: 0; }
    }
  </style>
</head>

    };

    function render(data) {
      var bar = document.getElementById("hours");
      bar.textContent = data.cafe.hours_en;
      var barAr = document.createElement("span");
      barAr.className = "ar";
      barAr.textContent = data.cafe.hours_ar;
      bar.appendChild(barAr);
      document.getElementById("hoursNote").textContent = data.cafe.hours_en;

      var cols = document.getElementById("columns");
      cols.textContent = "";
      var left = document.createElement("div");
      var right = document.createElement("div");
      var mid = Math.ceil(data.sections.length / 2);

      data.sections.forEach(function (s, i) {
        var g = document.createElement("div");
        g.className = "group";

        var head = document.createElement("div");
        head.className = "group-head";
        var num = document.createElement("span");
        num.className = "num";
        num.textContent = ("0" + (i + 1)).slice(-2);
        head.appendChild(num);

        var langs = document.createElement("div");
        langs.className = "lang";
        var en = document.createElement("span");
        en.className = "en";
        en.textContent = s.en;
        var ar = document.createElement("span");
        ar.className = "ar";
        ar.textContent = s.ar;
        langs.appendChild(en);
        langs.appendChild(ar);
        head.appendChild(langs);

        if (s.icon && ICONS[s.icon]) {
          head.insertAdjacentHTML("beforeend", ICONS[s.icon]);
        }
        g.appendChild(head);

        var itemsBox = document.createElement("div");
        itemsBox.className = "items";
        s.items.forEach(function (it) {
          var row = document.createElement("div");
          row.className = "item";

          var names = document.createElement("div");
          names.className = "names";
          var nm = document.createElement("div");
          nm.className = "name";
          nm.textContent = it.en;
          names.appendChild(nm);
          var na = document.createElement("div");
          na.className = "ar";
          na.textContent = it.ar;
          names.appendChild(na);

          var meta = document.createElement("div");
          meta.className = "meta";
          if (it.size) {
            var oz = document.createElement("span");
            oz.className = "oz";
            oz.textContent = it.size;
            meta.appendChild(oz);
            var dv = document.createElement("span");
            dv.className = "divider";
            meta.appendChild(dv);
          }
          var pr = document.createElement("span");
          pr.className = "price";
          pr.textContent = it.price;
          meta.appendChild(pr);
          var ry = document.createElement("img");
          ry.className = "riyal";
          ry.src = "assets/Saudi_Riyal_Symbol.svg";
          ry.alt = "";
          meta.appendChild(ry);

          row.appendChild(names);
          row.appendChild(meta);
          itemsBox.appendChild(row);
        });
        g.appendChild(itemsBox);

        (i < mid ? left : right).appendChild(g);
      });

      cols.appendChild(left);
      cols.appendChild(right);
    }

    render(EMBEDDED);

    if (window.location.protocol === "http:" || window.location.protocol === "https:") {

        .then(function (r) { return r.text(); })
        .then(function (html) {
          var m = html.match(/<script id="menu-data" type="application\/json">([\s\S]*?)<\/script>/);
          if (m) render(JSON.parse(m[1]));
        })
        .catch(function () {});
