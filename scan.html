<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Here</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .qr {
      width: 260px;
      height: 260px;
    }
    p {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }
    p + p { margin-top: 8px; }
    [dir="rtl"] { font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
  </style>
</head>
<body>
  <img class="qr" src="qr-menu.png" alt="QR code">
  <p>Scan here for menu</p>
    <p dir="rtl">امسح هنا لعرض القائمة</p>
</body>
</html>
